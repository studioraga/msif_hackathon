[project]
name = "msif-governed-silicon"
version = "0.1.0"
description = "Governed model-to-RTL prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
]

[dependency-groups]
gpu = [
    "torch==2.14.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
